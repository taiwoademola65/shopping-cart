<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Jumia Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        min-height: 100vh;
        background: #f4f7fb;
      }

      .cart-card {
        max-width: 34rem;
        border: 0;
        border-radius: 1rem;
      }

      #display {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      #display p {
        width: 100% !important;
        margin: 1rem auto 0 !important;
        border: 1px solid var(--bs-border-color);
        border-bottom: 0;
        border-radius: 0.75rem 0.75rem 0 0 !important;
        background: var(--bs-primary-bg-subtle) !important;
        color: var(--bs-primary-text-emphasis) !important;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      #display p + button,
      #display p + button + button {
        width: 50%;
        margin: 0 0 1rem;
      }

      #display p + button {
        border-radius: 0 0 0 0.75rem;
      }

      #display p + button + button {
        border-radius: 0 0 0.75rem 0;
      }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <section class="card cart-card shadow-sm mx-auto">
        <div class="card-body p-4 p-md-5">
          <header class="text-center mb-4">
            <div class="fs-1 mb-2" aria-hidden="true">&#128722;</div>
            <h1 class="h2 fw-bold text-primary mb-1">Mini Jumia Cart</h1>
            <p class="text-secondary mb-0">Add items and manage your shopping list.</p>
          </header>

          <div
            id="show"
            class="alert alert-success py-2"
            style="display: none"
            role="status"
          >
            You have successfully deleted an item
          </div>

          <label for="userInput" class="form-label fw-semibold">New item</label>
          <input
            type="text"
            id="userInput"
            placeholder="Enter your item here"
            class="form-control"
          />
          <button onclick="addItem()" class="btn btn-primary w-100 mt-3">
            Add item
          </button>

          <div class="row g-2 mt-1">
            <div class="col-6">
              <button onclick="deleteLast()" class="btn btn-outline-secondary w-100">
                Delete last
              </button>
            </div>
            <div class="col-6">
              <button onclick="deleteAllItems()" class="btn btn-outline-danger w-100">
                Delete all
              </button>
            </div>
          </div>

          <hr class="my-4" />
          <h2 class="h5 fw-bold mb-0">Your items</h2>
          <div id="display" class="text-center text-secondary"></div>
          <p class="small text-secondary mt-2 mb-0">
            Items you add will appear here.
          </p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
